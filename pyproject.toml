[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stratoclave-loom"
version = "0.1.0.dev0"
description = "Pure Python abstraction over coding agent CLIs (Claude Code, OpenCode, Kiro, Codex) speaking ACP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "littlemex" }]
keywords = [
    "agent",
    "acp",
    "claude-code",
    "opencode",
    "stratoclave",
    "coding-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
bedrock = [
    # Native Bedrock Runtime + control-plane access for the bedrock adapter.
    # Kept as an optional extra so the core package stays dependency-free
    # for users who only need the CLI-backed adapters.
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/littlemex/stratoclave-loom"
Issues = "https://github.com/littlemex/stratoclave-loom/issues"
Documentation = "https://github.com/littlemex/stratoclave-loom/tree/main/docs"

[project.scripts]
stratoclave-loom = "stratoclave_loom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stratoclave_loom"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
]

# ----------- ruff -----------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "ASYNC", # async correctness
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

# ----------- mypy -----------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src/stratoclave_loom"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ----------- pytest -----------

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "e2e: end-to-end tests against a real agent CLI (skipped by default)",
    "slow: tests that take longer than ~1s",
]

[tool.coverage.run]
branch = true
source = ["stratoclave_loom"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
